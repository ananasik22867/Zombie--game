<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Pixel Zombie</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:monospace;
    touch-action:none;
}

canvas{
    display:block;
    width:100%;
    height:100%;
    image-rendering:pixelated;
}

.screen{
    position:fixed;
    inset:0;
    z-index:20;
    background:#101510;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
}

h1{
    font-size:42px;
    margin:10px;
}

button{
    background:#303030;
    color:white;
    border:3px solid #888;
    padding:12px 25px;
    margin:6px;
    font:bold 18px monospace;
}

button:active{
    transform:scale(.96);
}

.hidden{
    display:none!important;
}

/* Магазин */

#shop{
    width:95%;
    max-width:900px;
    max-height:75vh;
    overflow:auto;
    background:#181818;
    padding:12px;
}

.item{
    display:inline-block;
    vertical-align:top;
    width:190px;
    min-height:145px;
    margin:5px;
    padding:10px;
    border:2px solid #555;
}

.price{
    color:#ffd43b;
}

/* Верхние кнопки */

.topButton{
    position:fixed;
    z-index:10;
    top:8px;
    padding:7px 10px;
    margin:0;
    font-size:14px;
}

#shopGame{
    right:8px;
}

#changeWeapon{
    right:100px;
}

/* Телефон */

#joystick{
    position:fixed;
    z-index:10;
    left:20px;
    bottom:20px;
    width:130px;
    height:130px;
    border-radius:50%;
    border:4px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.12);
}

#stick{
    position:absolute;
    left:31px;
    top:31px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:rgba(255,255,255,.45);
}

/* Кнопка стрельбы */

#fire{
    position:fixed;
    z-index:10;
    right:25px;
    bottom:35px;
    width:100px;
    height:100px;
    border-radius:50%;
    background:#8b2222;
    border:4px solid #ddd;
    font-size:20px;
}

/* Устройство */

#deviceScreen{
    z-index:100;
}

.device{
    width:90%;
    max-width:500px;
    background:#202820;
    border:4px solid #777;
    padding:25px;
}

.device button{
    width:100%;
    padding:18px;
    font-size:23px;
}

@media(max-width:600px){
    h1{font-size:30px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ВЫБОР УСТРОЙСТВА -->

<div id="deviceScreen" class="screen">

    <div class="device">

        <h1>☠ PIXEL ZOMBIE ☠</h1>

        <h2>На чём играешь?</h2>

        <button id="pcButton">💻 ПК</button>

        <button id="phoneButton">📱 ТЕЛЕФОН</button>

    </div>

</div>


<!-- ГЛАВНОЕ МЕНЮ -->

<div id="menu" class="screen hidden">

    <h1>☠ PIXEL ZOMBIE ☠</h1>

    <p id="info">🪙 Монеты: 0 | 🏆 Рекорд: 0</p>

    <button id="play">▶ ИГРАТЬ</button>

    <button id="shopButton">🏪 МАГАЗИН</button>

    <div id="shop" class="hidden"></div>

</div>


<!-- КНОПКИ ИГРЫ -->

<button id="shopGame" class="topButton hidden">🏪</button>

<button id="changeWeapon" class="topButton hidden">🔄 Оружие</button>


<!-- ТЕЛЕФОН -->

<div id="joystick" class="hidden">
    <div id="stick"></div>
</div>

<button id="fire" class="hidden">🔥</button>


<script>

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;
}

resize();

addEventListener("resize",resize);


/* =========================
   УСТРОЙСТВО
========================= */

let device=localStorage.getItem("device");

const deviceScreen=document.getElementById("deviceScreen");
const joystick=document.getElementById("joystick");
const fire=document.getElementById("fire");

function chooseDevice(type){

    device=type;

    localStorage.setItem("device",type);

    deviceScreen.classList.add("hidden");

    if(type==="phone"){
        joystick.classList.remove("hidden");
        fire.classList.remove("hidden");
    }else{
        joystick.classList.add("hidden");
        fire.classList.add("hidden");
    }
}

if(device){
    chooseDevice(device);
}

document.getElementById("pcButton").onclick=()=>{
    chooseDevice("pc");
};

document.getElementById("phoneButton").onclick=()=>{
    chooseDevice("phone");
};


/* =========================
   СОХРАНЕНИЕ
========================= */

let coins=Number(localStorage.getItem("coins")||0);
let best=Number(localStorage.getItem("best")||0);

let owned=JSON.parse(
    localStorage.getItem("owned")||
    "[true,false,false,false,false,false,false,false]"
);

while(owned.length<8){
    owned.push(false);
}


/* =========================
   ОРУЖИЕ
========================= */

/*
name, price, damage, cooldown,
speed, bullets
*/

const weapons=[

    ["Лук",0,30,450,10,1],

    ["Старый пистолет",50,25,350,13,1],

    ["Револьвер",100,40,500,14,1],

    ["Дробовик",175,45,800,10,6],

    ["SMG",300,18,110,15,1],

    ["Автомат",450,35,120,16,1],

    ["Снайперка",800,100,1000,20,1],

    ["Ракетница",1500,300,1200,9,1]

];


/* =========================
   КЛАССЫ
========================= */

const classes=[

    ["Обычный",50,100,3.5,0,1.0],

    ["Стрелок",150,130,3.8,1,1.2],

    ["Охотник",300,125,4.2,2,1.1],

    ["Штурмовик",500,170,4.0,5,1.15],

    ["Снайпер",800,120,3.6,6,1.1],

    ["Тяжёлый",1200,230,3.1,5,1.2],

    ["Ракетчик",1800,250,3.0,7,1.0],

    ["Тесла",10000,330,4.2,0,1.0]

];


/* =========================
   ИГРА
========================= */

let playing=false;

let wave=0;
let total=0;
let spawned=0;
let killed=0;

let zombies=[];
let bullets=[];

let spawnTimer=0;
let lastShot=0;

let weapon=0;

let player={
    x:0,
    y:0,
    hp:100,
    maxHp:100,
    speed:3.5,
    damageMult:1
};


/* =========================
   УПРАВЛЕНИЕ
========================= */

let keys={};

let mouse={
    x:W/2,
    y:H/2,
    down:false
};

let touchShoot=false;


/* =========================
   СТАРТ
========================= */

function startGame(){

    document.getElementById("menu")
        .classList.add("hidden");

    document.getElementById("shopGame")
        .classList.remove("hidden");

    if(device==="phone"){
        document.getElementById("changeWeapon")
            .classList.remove("hidden");
    }

    player={
        x:W/2,
        y:H/2,
        hp:100,
        maxHp:100,
        speed:3.5,
        damageMult:1
    };

    weapon=0;

    /* Загружаем купленный класс */

    for(let i=0;i<classes.length;i++){

        if(localStorage.getItem("class"+i)==="1"){

            player.maxHp=classes[i][2];
            player.hp=player.maxHp;

            player.speed=classes[i][3];

            weapon=classes[i][4];

            player.damageMult=classes[i][5];

        }

    }

    zombies=[];
    bullets=[];

    wave=0;

    playing=true;

    nextWave();
}


/* =========================
   ВОЛНА
========================= */

function nextWave(){

    wave++;

    total=10+wave*5;

    spawned=0;

    killed=0;

    spawnTimer=0;

    if(wave>best){
        best=wave;
        save();
    }
}


/* =========================
   СОЗДАНИЕ ЗОМБИ
========================= */

function spawnZombie(){

    let side=Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x=-40;
        y=Math.random()*H;
    }

    if(side===1){
        x=W+40;
        y=Math.random()*H;
    }

    if(side===2){
        x=Math.random()*W;
        y=-40;
    }

    if(side===3){
        x=Math.random()*W;
        y=H+40;
    }

    let r=Math.random();

    let type="normal";

    if(wave>=3 && r<.18)
        type="fast";

    if(wave>=5 && r<.10)
        type="tank";

    if(wave>=8 && r<.07)
        type="boss";


    let z;


    if(type==="normal"){

        z={
            hp:40+wave*6,
            speed:.7,
            size:15,
            coin:5
        };

    }


    if(type==="fast"){

        z={
            hp:70+wave*8,
            speed:1.5,
            size:12,
            coin:10
        };

    }


    if(type==="tank"){

        z={
            hp:300+wave*25,
            speed:.4,
            size:25,
            coin:30
        };

    }


    if(type==="boss"){

        z={
            hp:1000+wave*100,
            speed:.35,
            size:38,
            coin:100
        };

    }


    zombies.push({

        x:x,
        y:y,

        hp:z.hp,
        maxHp:z.hp,

        speed:z.speed,
        size:z.size,

        coin:z.coin,

        type:type

    });

    spawned++;
}


/* =========================
   СТРЕЛЬБА
========================= */

function shoot(){

    if(!playing)
        return;


    let now=performance.now();


    /* Тесла */

    if(weapon===8){

        if(now-lastShot<700)
            return;

        lastShot=now;

        let target=null;
        let dist=Infinity;

        for(let z of zombies){

            let d=Math.hypot(
                z.x-player.x,
                z.y-player.y
            );

            if(d<dist && d<300){

                dist=d;
                target=z;

            }

        }

        if(target){

            target.hp-=100*player.damageMult;

            for(let z of zombies){

                if(z!==target){

                    let d=Math.hypot(
                        z.x-target.x,
                        z.y-target.y
                    );

                    if(d<100){
                        z.hp-=50;
                    }

                }

            }

        }

        return;
    }


    let w=weapons[weapon];


    if(now-lastShot<w[3])
        return;

    lastShot=now;


    let angle=Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );


    for(let i=0;i<w[5];i++){

        let spread=0;

        if(w[5]>1){
            spread=(Math.random()-.5)*.6;
        }

        let a=angle+spread;

        bullets.push({

            x:player.x,
            y:player.y,

            vx:Math.cos(a)*w[4],
            vy:Math.sin(a)*w[4],

            damage:w[2]*player.damageMult,

            life:100,

            rocket:weapon===7

        });

    }

}


/* =========================
   UPDATE
========================= */

function update(){

    if(!playing)
        return;


    /* ДВИЖЕНИЕ */

    let dx=0;
    let dy=0;


    if(device==="pc"){

        dx=(keys.d?1:0)-(keys.a?1:0);
        dy=(keys.s?1:0)-(keys.w?1:0);

    }else{

        dx=joyX;
        dy=joyY;

    }


    if(dx!==0 || dy!==0){

        let len=Math.hypot(dx,dy);

        player.x+=dx/len*player.speed;
        player.y+=dy/len*player.speed;

    }


    player.x=Math.max(15,Math.min(W-15,player.x));
    player.y=Math.max(15,Math.min(H-15,player.y));


    /* СТРЕЛЬБА */

    if(device==="pc" && mouse.down)
        shoot();

    if(device==="phone" && touchShoot)
        shoot();


    /* СПАВН */

    spawnTimer--;

    if(spawned<total && spawnTimer<=0){

        spawnZombie();

        spawnTimer=Math.max(10,40-wave);

    }


    /* ПУЛИ */

    for(let b of bullets){

        b.x+=b.vx;
        b.y+=b.vy;

        b.life--;

    }


    /* ПОПАДАНИЯ */

    for(let b of bullets){

        if(b.life<=0)
            continue;


        for(let z of zombies){

            let d=Math.hypot(
                b.x-z.x,
                b.y-z.y
            );


            if(d<z.size+5){

                z.hp-=b.damage;

                b.life=0;


                /* Ракета */

                if(b.rocket){

                    for(let q of zombies){

                        let rd=Math.hypot(
                            q.x-z.x,
                            q.y-z.y
                        );

                        if(rd<90){
                            q.hp-=100;
                        }

                    }

                }

                break;

            }

        }

    }


    bullets=bullets.filter(
        b=>
            b.life>0 &&
            b.x>-100 &&
            b.x<W+100 &&
            b.y>-100 &&
            b.y<H+100
    );


    /* ЗОМБИ */

    for(let z of zombies){

        let dx=player.x-z.x;
        let dy=player.y-z.y;

        let d=Math.hypot(dx,dy);


        if(d>z.size+12){

            z.x+=dx/d*z.speed;
            z.y+=dy/d*z.speed;

        }else{

            player.hp-=0.12;

        }

    }


    /* УБИЙСТВА */

    for(let i=zombies.length-1;i>=0;i--){

        if(zombies[i].hp<=0){

            coins+=zombies[i].coin;

            killed++;

            zombies.splice(i,1);

            save();

        }

    }


    /* СЛЕДУЮЩАЯ ВОЛНА */

    if(
        spawned>=total &&
        zombies.length===0
    ){

        nextWave();

    }


    /* СМЕРТЬ */

    if(player.hp<=0){

        endGame();

    }

}


/* =========================
   РИСОВАНИЕ
========================= */

function draw(){

    ctx.fillStyle="#182018";
    ctx.fillRect(0,0,W,H);


    /* Сетка */

    ctx.strokeStyle="#202b20";

    for(let x=0;x<W;x+=32){

        ctx.beginPath();
        ctx.moveTo(x,0);
        ctx.lineTo(x,H);
        ctx.stroke();

    }


    for(let y=0;y<H;y+=32){

        ctx.beginPath();
        ctx.moveTo(0,y);
        ctx.lineTo(W,y);
        ctx.stroke();

    }


    /* ЗОМБИ */

    for(let z of zombies){

        if(z.type==="normal")
            ctx.fillStyle="#55a83d";

        if(z.type==="fast")
            ctx.fillStyle="#b8d94c";

        if(z.type==="tank")
            ctx.fillStyle="#405a40";

        if(z.type==="boss")
            ctx.fillStyle="#a83dcc";


        ctx.fillRect(
            z.x-z.size,
            z.y-z.size,
            z.size*2,
            z.size*2
        );


        /* Глаза */

        ctx.fillStyle="#f22";

        ctx.fillRect(
            z.x-z.size/2,
            z.y-z.size/3,
            5,
            5
        );

        ctx.fillRect(
            z.x+z.size/4,
            z.y-z.size/3,
            5,
            5
        );


        /* HP */

        ctx.fillStyle="#222";

        ctx.fillRect(
            z.x-z.size,
            z.y-z.size-8,
            z.size*2,
            5
        );

        ctx.fillStyle="#e33";

        ctx.fillRect(
            z.x-z.size,
            z.y-z.size-8,
            z.size*2*
            Math.max(0,z.hp/z.maxHp),
            5
        );

    }


    /* ПУЛИ */

    for(let b of bullets){

        ctx.fillStyle=
            b.rocket ? "#ff6b30" : "#ffe45c";

        ctx.fillRect(
            b.x-3,
            b.y-3,
            6,
            6
        );

    }


    /* ИГРОК */

    ctx.fillStyle="#4287ff";

    ctx.fillRect(
        player.x-12,
        player.y-12,
        24,
        24
    );


    /* ОРУЖИЕ */

    let angle=Math.atan2(
        mouse.y-player.y,
        mouse.x-player.x
    );

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );

    ctx.rotate(angle);

    ctx.fillStyle=
        weapon===8 ? "#8ee7ff" : "#777";

    ctx.fillRect(
        8,
        -4,
        28,
        8
    );

    ctx.restore();


    /* HUD */

    ctx.fillStyle="white";
    ctx.font="18px monospace";

    ctx.fillText(
        "ВОЛНА: "+wave,
        15,
        25
    );

    ctx.fillText(
        "УБИТО: "+killed+"/"+total,
        15,
        48
    );

    ctx.fillText(
        "ОСТАЛОСЬ: "+
        (zombies.length+total-spawned),
        15,
        71
    );

    ctx.fillText(
        "🪙 "+coins,
        15,
        94
    );

    ctx.fillText(
        "🏆 "+best,
        15,
        117
    );


    let weaponName=
        weapon===8 ?
        "Пушка Теслы" :
        weapons[weapon][0];


    ctx.fillText(
        "🔫 "+weaponName,
        15,
        140
    );


    /* HP */

    ctx.fillStyle="#222";

    ctx.fillRect(
        15,
        155,
        230,
        20
    );

    ctx.fillStyle="#35d957";

    ctx.fillRect(
        15,
        155,
        230*
        Math.max(
            0,
            player.hp/player.maxHp
        ),
        20
    );

}


/* =========================
   КОНЕЦ ИГРЫ
========================= */

function endGame(){

    playing=false;

    save();

    document.getElementById("shopGame")
        .classList.add("hidden");

    document.getElementById("changeWeapon")
        .classList.add("hidden");

    if(device==="phone"){

        joystick.classList.remove("hidden");
        fire.classList.remove("hidden");

    }


    document.getElementById("menu")
        .classList.remove("hidden");

    updateInfo();

}


/* =========================
   КЛАВИАТУРА
========================= */

addEventListener("keydown",e=>{

    if(device!=="pc")
        return;

    keys[e.key.toLowerCase()]=true;


    if(e.key>="1" && e.key<="8"){

        let i=Number(e.key)-1;

        if(owned[i]){
            weapon=i;
        }

    }

});


addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

});


/* =========================
   МЫШЬ
========================= */

canvas.addEventListener("mousemove",e=>{

    if(device!=="pc")
        return;

    mouse.x=e.clientX;
    mouse.y=e.clientY;

});


canvas.addEventListener("mousedown",e=>{

    if(device!=="pc")
        return;

    mouse.x=e.clientX;
    mouse.y=e.clientY;

    mouse.down=true;

});


addEventListener("mouseup",()=>{

    mouse.down=false;

});


/* =========================
   ТЕЛЕФОН
========================= */

let joyX=0;
let joyY=0;
let joyActive=false;


function joystickMove(e){

    let rect=joystick.getBoundingClientRect();

    let cx=rect.left+rect.width/2;
    let cy=rect.top+rect.height/2;

    let dx=e.clientX-cx;
    let dy=e.clientY-cy;

    let d=Math.hypot(dx,dy);

    let max=48;

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;

    }

    joyX=dx/max;
    joyY=dy/max;

    document.getElementById("stick")
        .style.transform=
        `translate(${dx}px,${dy}px)`;

}


joystick.addEventListener("pointerdown",e=>{

    if(device!=="phone")
        return;

    joyActive=true;

    joystick.setPointerCapture(e.pointerId);

    joystickMove(e);

});


joystick.addEventListener("pointermove",e=>{

    if(joyActive)
        joystickMove(e);

});


function stopJoy(){

    joyActive=false;

    joyX=0;
    joyY=0;

    document.getElementById("stick")
        .style.transform="translate(0,0)";

}


joystick.addEventListener("pointerup",stopJoy);
joystick.addEventListener("pointercancel",stopJoy);


/* Телефонная стрельба */

canvas.addEventListener("pointerdown",e=>{

    if(device!=="phone")
        return;

    mouse.x=e.clientX;
    mouse.y=e.clientY;

});


canvas.addEventListener("pointermove",e=>{

    if(device!=="phone")
        return;

    mouse.x=e.clientX;
    mouse.y=e.clientY;

});


fire.addEventListener("pointerdown",e=>{

    if(device!=="phone")
        return;

    e.preventDefault();

    touchShoot=true;

});


fire.addEventListener("pointerup",()=>{

    touchShoot=false;

});

fire.addEventListener("pointercancel",()=>{

    touchShoot=false;

});


/* =========================
   МЕНЮ
========================= */

document.getElementById("play").onclick=startGame;


/* =========================
   ИНФОРМАЦИЯ
========================= */

function updateInfo(){

    document.getElementById("info").textContent=
        "🪙 Монеты: "+
        coins+
        " | 🏆 Рекорд: "+
        best;

}


/* =========================
   СОХРАНЕНИЕ
========================= */

function save(){

    localStorage.setItem(
        "coins",
        coins
    );

    localStorage.setItem(
        "best",
        best
    );

    localStorage.setItem(
        "owned",
        JSON.stringify(owned)
    );

}


/* =========================
   МАГАЗИН
========================= */

const shop=document.getElementById("shop");

function openShop(){

    shop.classList.toggle("hi
