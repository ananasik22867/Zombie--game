<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Pixel Zombie</title>

<style>

html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:#101510;
 font-family:monospace;
 touch-action:none;
}

canvas{
 display:block;
 background:#182018;
 image-rendering:pixelated;
}


/* МЕНЮ */

#menu{
 position:fixed;
 inset:0;
 background:#101510;
 color:white;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
}

h1{
 font-size:40px;
 margin:10px;
}

button{
 font:20px monospace;
 padding:12px 30px;
 margin:6px;
 background:#333;
 color:white;
 border:3px solid #aaa;
 cursor:pointer;
}


/* МАГАЗИН */

#shop{
 display:none;
 max-width:850px;
 max-height:65vh;
 overflow:auto;
 background:#181818;
 padding:12px;
}

.item{
 display:inline-block;
 width:190px;
 min-height:120px;
 margin:5px;
 padding:10px;
 border:2px solid #555;
}

.price{
 color:#ffd43b;
}


/* ВЫБОР УСТРОЙСТВА */

#deviceScreen{
 position:fixed;
 inset:0;
 background:#101510;
 color:white;
 display:flex;
 align-items:center;
 justify-content:center;
 text-align:center;
 z-index:1000;
}

#deviceBox{
 background:#202820;
 border:4px solid #777;
 padding:25px;
 width:min(90%,500px);
 box-sizing:border-box;
}

#deviceBox h2{
 font-size:28px;
 margin-top:0;
}

.deviceButton{
 display:block;
 width:100%;
 box-sizing:border-box;
 font-size:24px;
 padding:18px;
 margin:12px 0;
}


/* КНОПКА СМЕНЫ УСТРОЙСТВА */

#changeDevice{
 position:fixed;
 top:8px;
 right:8px;
 z-index:2000;
 font-size:13px;
 padding:5px 8px;
 margin:0;
}


/* КНОПКА СМЕНЫ ОРУЖИЯ */

#changeWeapon{
 display:none;
 position:fixed;
 top:8px;
 right:55px;
 z-index:100;
 font-size:16px;
 padding:7px 10px;
 margin:0;
 background:#333;
 color:white;
 border:3px solid #aaa;
}


/* ДЖОЙСТИК */

#joystick{
 display:none;
 position:fixed;
 left:25px;
 bottom:25px;
 width:130px;
 height:130px;
 border-radius:50%;
 background:rgba(255,255,255,.15);
 border:4px solid rgba(255,255,255,.35);
 z-index:50;
 touch-action:none;
}

#stick{
 position:absolute;
 left:35px;
 top:35px;
 width:60px;
 height:60px;
 border-radius:50%;
 background:rgba(255,255,255,.45);
 border:3px solid rgba(255,255,255,.7);
 box-sizing:border-box;
 pointer-events:none;
}


@media(max-width:600px){

 h1{
  font-size:28px;
 }

 button{
  font-size:18px;
 }

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<button id="changeDevice">⚙️</button>

<button id="changeWeapon">🔄 Оружие</button>


<!-- ВЫБОР УСТРОЙСТВА -->

<div id="deviceScreen">

 <div id="deviceBox">

  <h2>🎮 НА ЧЁМ ИГРАЕШЬ?</h2>

  <p>
   Выбери устройство для управления
  </p>

  <button class="deviceButton" id="pcButton">
   💻 ПК
  </button>

  <button class="deviceButton" id="phoneButton">
   📱 ТЕЛЕФОН
  </button>

 </div>

</div>


<!-- МЕНЮ -->

<div id="menu">

 <h1>☠ PIXEL ZOMBIE ☠</h1>

 <p id="info">
  Монеты: 0 | Лучшая волна: 0
 </p>

 <button id="play">
  ИГРАТЬ
 </button>

 <button id="shopBtn">
  МАГАЗИН
 </button>

 <div id="shop"></div>

</div>


<!-- ДЖОЙСТИК -->

<div id="joystick">

 <div id="stick"></div>

</div>


<script>


/* =========================
   CANVAS
========================= */

const canvas=
 document.getElementById("game");

const ctx=
 canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;


/* =========================
   УСТРОЙСТВО
========================= */

let device=
 localStorage.getItem("device") || null;

const deviceScreen=
 document.getElementById("deviceScreen");

const joystick=
 document.getElementById("joystick");

const stick=
 document.getElementById("stick");

const changeDevice=
 document.getElementById("changeDevice");

const changeWeapon=
 document.getElementById("changeWeapon");


function chooseDevice(type){

 device=type;

 localStorage.setItem(
  "device",
  type
 );

 deviceScreen.style.display="none";

 if(type==="phone"){

  joystick.style.display="block";

 }else{

  joystick.style.display="none";

 }

}


/* Если устройство уже выбрано */

if(device){

 deviceScreen.style.display="none";

}


/* ПК */

document.getElementById("pcButton")
 .onclick=()=>{

  chooseDevice("pc");

 };


/* ТЕЛЕФОН */

document.getElementById("phoneButton")
 .onclick=()=>{

  chooseDevice("phone");

 };


/* СМЕНИТЬ УСТРОЙСТВО */

changeDevice.onclick=()=>{

 deviceScreen.style.display="flex";

 changeWeapon.style.display="none";

};


/* =========================
   RESIZE
========================= */

addEventListener(
 "resize",
 ()=>{

  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;

 }
);


/* =========================
   СОХРАНЕНИЕ
========================= */

let coins=
 +localStorage.getItem("coins") || 0;

let best=
 +localStorage.getItem("best") || 0;


let owned=JSON.parse(
 localStorage.getItem("owned") ||
 "[true,false,false,false,false,false,false,false]"
);


while(owned.length<8)
 owned.push(false);


/* =========================
   ПЕРЕМЕННЫЕ
========================= */

let game=false;

let keys={};

let zombies=[];

let shots=[];

let wave=0;

let total=0;

let spawned=0;

let killed=0;

let spawnTimer=0;

let lastShot=0;

let weapon=0;


/* =========================
   ИГРОК
========================= */

let player={

 x:0,
 y:0,

 hp:100,
 maxHp:100,

 speed:3.5,

 damageMult:1

};


/* =========================
   ПРИЦЕЛ
========================= */

let mouse={

 x:W/2,
 y:H/2,

 down:false

};


/* =========================
   МОБИЛЬНАЯ СТРЕЛЬБА
========================= */

let touchShoot=false;


/* =========================
   ОРУЖИЕ
========================= */

const weapons=[

 ["Лук",0,30,450,11,1],

 ["Старый пистолет",50,25,350,13,1],

 ["Револьвер",100,35,500,14,1],

 ["Дробовик",175,45,800,10,6],

 ["SMG",300,35,110,14,1],

 ["Автомат",450,45,120,15,1],

 ["Снайперка",800,90,1000,20,1],

 ["Ракетница",1500,300,1200,9,1]

];


/* =========================
   КЛАССЫ
========================= */

const classes=[

 ["Обычный",50,100,3.5,0,1.0],

 ["Стрелок",150,130,3.8,1,1.2],

 ["Охотник",300,125,4.2,2,1.1],

 ["Штурмовик",500,170,4,5,1.15],

 ["Снайпер",800,120,3.6,6,1.1],

 ["Тяжёлый",1200,230,3.1,5,1.2],

 ["Ракетчик",1800,250,3,7,1.0],

 ["Тесла",10000,330,4.2,8,1.0]

];


function save(){

 localStorage.setItem(
  "coins",
  coins
 );

 localStorage.setItem(
  "best",
  best
 );

 localStorage.setItem(
  "owned",
  JSON.stringify(owned)
 );

}


/* =========================
   СМЕНА ОРУЖИЯ НА ТЕЛЕФОНЕ
========================= */

function nextWeapon(){

 if(device!=="phone")
  return;

 let start=weapon;

 do{

  weapon++;

  if(weapon>=8)
   weapon=0;

 }while(
  !owned[weapon] &&
  weapon!==start
 );

}


/* Кнопка */

changeWeapon.onclick=nextWeapon;


/* =========================
   СТАРТ
========================= */

function start(){

 document.getElementById("menu")
  .style.display="none";

 changeDevice.style.display="none";

 if(device==="phone"){

  changeWeapon.style.display="block";

 }else{

  changeWeapon.style.display="none";

 }

 player={

  x:W/2,
  y:H/2,

  hp:100,
  maxHp:100,

  speed:3.5,

  damageMult:1

 };


 for(
  let i=0;
  i<classes.length;
  i++
 ){

  if(
   localStorage.getItem(
    "class"+i
   )==="1"
  ){

   player.hp=
   player.maxHp=
   classes[i][2];

   player.speed=
   classes[i][3];

   weapon=
   classes[i][4];

   player.damageMult=
   classes[i][5];

  }

 }


 zombies=[];
 shots=[];

 wave=0;

 game=true;

 nextWave();

}


/* =========================
   НОВАЯ ВОЛНА
========================= */

function nextWave(){

 wave++;

 total=
  10+
  wave*7;

 spawned=0;

 killed=0;

 spawnTimer=0;

 if(wave>best){

  best=wave;

  save();

 }

}


/* =========================
   ЗОМБИ
========================= */

function spawn(){

 let side=
  Math.floor(
   Math.random()*4
  );

 let x,y;


 if(side===0){

  x=-30;
  y=Math.random()*H;

 }

 if(side===1){

  x=W+30;
  y=Math.random()*H;

 }

 if(side===2){

  x=Math.random()*W;
  y=-30;

 }

 if(side===3){

  x=Math.random()*W;
  y=H+30;

 }


 let r=Math.random();

 let type="normal";


 if(wave>=3 && r<.18)
  type="fast";

 if(wave>=5 && r<.12)
  type="fire";

 if(wave>=7 && r<.10)
  type="ghost";

 if(wave>=9 && r<.08)
  type="poison";

 if(wave>=11 && r<.07)
  type="tank";

 if(wave>=14 && r<.05)
  type="brute";

 if(wave>=18 && r<.03)
  type="boss";


 let d;


 if(type==="normal")
  d={
   hp:45+wave*7,
   sp:.75,
   sz:15,
   coin:5
  };


 if(type==="fast")
  d={
   hp:80+wave*9,
   sp:1.7,
   sz:12,
   coin:10
  };


 if(type==="fire")
  d={
   hp:180+wave*10,
   sp:1,
   sz:17,
   coin:20
  };


 if(type==="ghost")
  d={
   hp:120+wave*8,
   sp:1.3,
   sz:14,
   coin:25
  };


 if(type==="poison")
  d={
   hp:250+wave*15,
   sp:.65,
   sz:19,
   coin:40
  };


 if(type==="tank")
  d={
   hp:300+wave*30,
   sp:.38,
   sz:27,
   coin:35
  };


 if(type==="brute")
  d={
   hp:500+wave*40,
   sp:.5,
   sz:32,
   coin:50
  };


 if(type==="boss")
  d={
   hp:1000+wave*80,
   sp:.45,
   sz:38,
   coin:100
  };


 zombies.push({

  x:x,
  y:y,

  hp:d.hp,
  max:d.hp,

  sp:d.sp,
  sz:d.sz,

  coin:d.coin,

  type:type

 });


 spawned++;

}


/* =========================
   СТРЕЛЬБА
========================= */

function shoot(){

 /* ТЕСЛА */

 if(weapon===8){

  let now=
   performance.now();

  if(
   now-lastShot<700
  )
   return;

  lastShot=now;


  let target=null;

  let bestDist=Infinity;


  for(
   const z of zombies
  ){

   let d=
    Math.hypot(
     z.x-player.x,
     z.y-player.y
    );


   if(
    d<bestDist &&
    d<250
   ){

    bestDist=d;
    target=z;

   }

  }


  if(!target)
   return;


  let targets=[
   target
  ];

  let current=target;


  for(
   let n=1;
   n<4;
   n++
  ){

   let next=null;

   let nd=Infinity;


   for(
    const z of zombies
   ){

    if(
     targets.includes(z)
    )
     continue;


    let d=
     Math.hypot(
      z.x-current.x,
      z.y-current.y
     );


    if(
     d<nd &&
     d<100
    ){

     nd=d;
     next=z;

    }

   }


   if(!next)
    break;


   targets.push(next);

   current=next;

  }


  targets.forEach(
   (z,i)=>{

    z.hp-=
     [60,45,35,25][i];

   }
  );


  return;

 }


 /* ОБЫЧНОЕ ОРУЖИЕ */

 let w=
  weapons[weapon];

 let now=
  performance.now();


 if(
  now-lastShot<w[3]
 )
  return;


 lastShot=now;


 let a=
  Math.atan2(
   mouse.y-player.y,
   mouse.x-player.x
  );


 for(
  let i=0;
  i<w[5];
  i++
 ){

  let aa=
   a+
   (
    w[5]>1?
    (Math.random()-.5)*.6:
    0
   );


  shots.push({

   x:player.x,
   y:player.y,

   vx:
    Math.cos(aa)*w[4],

   vy:
    Math.sin(aa)*w[4],

   d:
    w[2]*
    player.damageMult,

   life:90,

   rocket:
    weapon===7

  });

 }

}


/* =========================
   ДЖОЙСТИК
========================= */

let joystickActive=false;

let joystickX=0;

let joystickY=0;


function moveJoystick(e){

 let rect=
  joystick.getBoundingClientRect();

 let centerX=
  rect.left+
  rect.width/2;

 let centerY=
  rect.top+
  rect.height/2;


 let dx=
  e.clientX-centerX;

 let dy=
  e.clientY-centerY;


 let distance=
  Math.hypot(dx,dy);

 let maxDistance=50;


 if(
  distance>maxDistance
 ){

  dx=
   dx/distance*
   maxDistance;

  dy=
   dy/distance*
   maxDistance;

 }


 joystickX=
  dx/maxDistance;

 joystickY=
  dy/maxDistance;


 stick.style.transform=
  `translate(${dx}px,${dy}px)`;

}


joystick.addEventListener(
 "pointerdown",
 e=>{

  if(device!=="phone")
   return;

  e.preventDefault();

  joystickActive=true;

  joystick.setPointerCapture(
   e.pointerId
  );

  moveJoystick(e);

 }
);


joystick.addEventListener(
 "pointermove",
 e=>{

  if(!joystickActive)
   return;

  e.preventDefault();

  moveJoystick(e);

 }
);


function stopJoystick(){

 joystickActive=false;

 joystickX=0;
 joystickY=0;

 stick.style.transform=
  "translate(0px,0px)";

}


joystick.addEventListener(
 "pointerup",
 stopJoystick
);

joystick.addEventListener(
 "pointercancel",
 stopJoystick
);


/* =========================
   UPDATE
========================= */

function update(){

 if(!game)
  return;


 /* ХОДЬБА */

 let dx=0;
 let dy=0;


 if(device==="pc"){

  dx=
   (keys.d?1:0)-
   (keys.a?1:0);

  dy=
   (keys.s?1:0)-
   (keys.w?1:0);

 }


 if(device==="phone"){

  dx=joystickX;
  dy=joystickY;

 }


 if(dx||dy){

  let l=
   Math.hypot(dx,dy);


  player.x+=
   dx/l*
   player.speed;

  player.y+=
   dy/l*
   player.speed;

 }


 player.x=
  Math.max(
   15,
   Math.min(
    W-15,
    player.x
   )
  );


 player.y=
  Math.max(
   15,
   Math.min(
    H-15,
    player.y
   )
  );


 /* СТРЕЛЬБА ПК */

 if(
  device==="pc" &&
  mouse.down
 )
  shoot();


 /* СТРЕЛЬБА ТЕЛЕФОН */

 if(
  device==="phone" &&
  touchShoot
 )
  shoot();


 /* СПАВН */

 if(
  spawned<total &&
  --spawnTimer<=0
 ){

  spawn();

  spawnTimer=
   Math.max(
    8,
    40-wave
   );

 }


 /* СНАРЯДЫ */

 for(
  const b of shots
 ){

  b.x+=b.vx;
  b.y+=b.vy;

  b.life--;

 }


 shots=
  shots.filter(
   b=>
    b.life>0 &&
    b.x>-100 &&
    b.x<W+100 &&
    b.y>-100 &&
    b.y<H+100
  );


 /* ЗОМБИ */

 for(
  const z of zombies
 ){

  let dx=
   player.x-z.x;

  let dy=
   player.y-z.y;

  let d=
   Math.hypot(dx,dy);


  if(
   d>z.sz+12
  ){

   z.x+=
    dx/d*
    z.sp;

   z.y+=
    dy/d*
    z.sp;

  }else{

   player.hp-=.12;

  }

 }


 /* ПОПАДАНИЯ */

 for(
  const b of shots
 )
 for(
  const z of zombies
 ){

  if(b.life<=0)
   continue;


  let d=
   Math.hypot(
    b.x-z.x,
    b.y-z.y
   );


  if(
   d<z.sz+5
  ){

   z.hp-=b.d;

   b.life=0;


   if(b.rocket){

    for(
     const q of zombies
    ){

     if(
      Math.hypot(
       q.x-z.x,
       q.y-z.y
      )<90
     ){

      q.hp-=100;

     }

    }

   }


   break;

  }

 }


 /* УБИЙСТВА */

 for(
  let i=zombies.length-1;
  i>=0;
  i--
 ){

  if(
   zombies[i].hp<=0
  ){

   coins+=
    zombies[i].coin;

   killed++;

   zombies.splice(i,1);

   save();

  }

 }


 if(
  spawned>=total &&
  zombies.length===0
 ){

  nextWave();

 }


 if(player.hp<=0)
  end();

}


/* =========================
   РИСОВАНИЕ
========================= */

function draw(){

 ctx.fillStyle="#182018";

 ctx.fillRect(
  0,0,W,H
 );


 /* СЕТКА */

 ctx.strokeStyle="#202b20";


 for(
  let x=0;
  x<W;
  x+=32
 ){

  ctx.beginPath();

  ctx.moveTo(x,0);
  ctx.lineTo(x,H);

  ctx.stroke();

 }


 for(
  let y=0;
  y<H;
  y+=32
 ){

  ctx.beginPath();

  ctx.moveTo(0,y);
  ctx.lineTo(W,y);

  ctx.stroke();

 }


 /* ЗОМБИ */

 for(
  const z of zombies
 ){

  ctx.fillStyle=

   z.type==="normal"?
    "#55a83d":

   z.type==="fast"?
    "#b8d94c":

   z.type==="fire"?
    "#ff6b35":

   z.type==="ghost"?
    "#bda8ff":

   z.type==="poison"?
    "#55e06f":

   z.type==="tank"?
    "#405a40":

   z.type==="brute"?
    "#8b5a3c":

    "#a83dcc";


  ctx.fillRect(
   z.x-z.sz,
   z.y-z.sz,
   z.sz*2,
   z.sz*2
  );


  ctx.fillStyle="#f33";


  ctx.fillRect(
   z.x-z.sz/2,
   z.y-z.sz/3,
   5,
   5
  );


  ctx.fillRect(
   z.x+z.sz/4,
   z.y-z.sz/3,
   5,
   5
  );


  ctx.fillStyle="#222";

  ctx.fillRect(
   z.x-z.sz,
   z.y-z.sz-8,
   z.sz*2,
   5
  );


  ctx.fillStyle="#e33";

  ctx.fillRect(
   z.x-z.sz,
   z.y-z.sz-8,
   z.sz*2*
   Math.max(
    0,
    z.hp/z.max
   ),
   5
  );

 }


 /* СНАРЯДЫ */

 for(
  const b of shots
 ){

  ctx.fillStyle=
   weapon===7?
    "#ff7b30":
    "#ffe45c";


  ctx.fillRect(
   b.x-3,
   b.y-3,
   6,
   6
  );

 }


 /* ИГРОК */

 ctx.fillStyle="#4287ff";

 ctx.fillRect(
  player.x-12,
  player.y-12,
  24,
  24
 );


 /* ОРУЖИЕ */

 let a=
  Math.atan2(
   mouse.y-player.y,
   mouse.x-player.x
  );


 ctx.save();

 ctx.translate(
  player.x,
  player.y
 );

 ctx.rotate(a);


 ctx.fillStyle=
  weapon===8?
   "#8ee7ff":
   "#777";


 ctx.fillRect(
  8,
  -4,
  25,
  8
 );


 ctx.restore();


 /* ТЕКСТ */

 ctx.fillStyle="#fff";

 ctx.font="18px monospace";


 ctx.fillText(
  "ВОЛНА: "+wave,
  15,25
 );


 ctx.fillText(
  "УБИТО: "+
  killed+
  "/"+
  total,
  15,48
 );


 ctx.fillText(
  "ОСТАЛОСЬ: "+
  (
   zombies.length+
   total-
   spawned
  ),
  15,71
 );


 ctx.fillText(
  "🪙 "+coins,
  15,94
 );


 ctx.fillText(
  "РЕКОРД: "+best,
  15,117
 );


 ctx.fillText(
  "ОРУЖИЕ: "+
  (
   weapon===8?
    "Пушка Теслы":
    weapons[weapon][0]
  ),
  15,140
 );


 /* HP */
